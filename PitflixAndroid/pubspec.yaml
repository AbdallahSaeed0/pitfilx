name: pitflix_android
description: "Pitflix — track, rate, and discover movies and TV shows."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.5.2+2

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Bebas Neue / DM Sans typography used throughout the design
  google_fonts: ^6.2.1

  # Direct REST calls to TMDB + Supabase (read-only, no backend proxy)
  http: ^1.2.2

  # Profile photo picker (Edit Profile)
  image_picker: ^1.1.2

  # Crop/reposition a picked avatar or cover photo before upload
  image_cropper: ^8.1.0

  # Real app version display (Settings screen)
  package_info_plus: ^8.1.2

  # Persists small user preferences (e.g. rating scale) across app restarts
  shared_preferences: ^2.3.3

  # Real Supabase Auth (login/signup/session) + PostgREST client for the
  # social schema (friends/activity/comments/likes)
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.2

  # Letterboxd/TV Time export import (Settings > Library)
  archive: ^3.6.1
  csv: ^6.0.0
  file_picker: ^8.1.6

  # My Device (Settings > "Enable My Device") — local-only video browsing,
  # fully isolated from the Supabase-synced library. photo_manager queries
  # MediaStore for on-device videos (grouped by folder) and owns the
  # READ_MEDIA_VIDEO/READ_EXTERNAL_STORAGE permission request; video_player
  # drives the custom local player; path_provider is used for the on-disk
  # scan-results cache.
  photo_manager: ^3.10.0
  # Pinned exact (no ^) — MyDevicePlayerScreen reads VideoPlayerController's
  # @visibleForTesting `playerId` getter to talk to the volume-boost native
  # channel (see third_party/video_player_android/PITFLIX_PATCH.md). That
  # member is explicitly disclaimed as unstable ("shouldn't be used by
  # anyone depending on the plugin"), so an unpinned version could rename or
  # remove it in a routine minor/patch bump without any changelog warning.
  # Bumping this requires re-checking that getter still exists/still means
  # the same thing first.
  video_player: 2.11.1
  path_provider: ^2.1.6

  # Disk-cached poster/backdrop images (Image.network only caches in memory,
  # which doesn't survive an app restart — every poster was re-downloading
  # from TMDB's CDN on every cold open, which is what actually made Home
  # feel slow to load rather than any of the underlying API calls).
  cached_network_image: ^3.4.1

  # My Device's video row "Share" action — native OS share sheet for a local
  # file.
  share_plus: ^12.0.2

  # Keeps the screen on while My Device's player is actually playing —
  # without this the OS treats video playback as "idle" (no touch input)
  # and dims/locks the screen on its own timeout mid-video.
  wakelock_plus: ^1.3.3

  # Left-half vertical swipe → screen brightness in MyDevicePlayerScreen
  # (mirrors the right-half volume swipe). setScreenBrightness only affects
  # this app's window, not the system-wide brightness setting.
  screen_brightness: ^1.0.1

# Vendored fork of video_player_android (see third_party/video_player_android/
# PITFLIX_PATCH.md) — adds a LoudnessEnhancer-backed volume boost past the
# 100% ceiling the stock plugin's setVolume hard-clamps to, for My Device's
# player. Same version (2.9.5) already resolved from pub.dev, just relocated
# and patched; video_player's own `^2.9.1` constraint on it is satisfied
# either way (path overrides aren't constraint-checked).
dependency_overrides:
  video_player_android:
    path: third_party/video_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the launcher icon (app logo) from assets/icon/*.png below.
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#5B21B6"
    theme_color: "#5B21B6"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5B21B6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
