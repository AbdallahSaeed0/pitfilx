# Pitflix mpv Configuration - LOW COST DIAGNOSTIC PROFILE
# Minimal resource usage for performance testing

# ===== Window & Display =====
no-border
ontop=yes
fullscreen=no
title=${media-title}
cursor-autohide=1000
cursor-autohide-fs-only=no

# ===== Video Quality - MINIMAL =====
# NO gpu-hq profile - use defaults
# NO expensive scaling
scale=bilinear
cscale=bilinear
dscale=bilinear
# NO debanding
deband=no
# Conservative hardware decoding
hwdec=auto-safe
# Simple video output
vo=gpu

# ===== Playback Behavior =====
keep-open=no
hr-seek=yes
hr-seek-framedrop=yes

# ===== Audio - SIMPLE =====
volume-max=200
# NO audio normalization filter

# ===== Subtitles - SIMPLE =====
sub-ass-vsfilter-blur-compat=no
sub-fix-timing=yes
sub-font="Arial"
sub-font-size=48
sub-color="#FFFFFF"
sub-border-size=2
sub-border-color="#000000"
# NO shadow
# NO blur
sub-pos=92

# ===== UI & Controls =====
osc=no
osd-bar=no
osd-font="Arial"
osd-font-size=24
osd-color="#FFFFFF"
osd-border-size=1
osd-border-color="#000000"
osd-duration=1500
osd-align-x=center
osd-align-y=top
osd-margin-y=60

# ===== Input & Interaction =====
input-default-bindings=yes

# ===== Screenshot =====
screenshot-format=png
screenshot-png-compression=8
screenshot-template="%F-%wH.%wM.%wS"
screenshot-directory="~/Pictures/mpv"

# ===== Cache & Network =====
cache=yes
demuxer-max-bytes=256M
demuxer-max-back-bytes=128M

# ===== Performance - MINIMAL =====
# NO display-resample
video-sync=audio
# NO interpolation
interpolation=no

# ===== Language Preferences =====
alang=eng,en,enUS,en-US
slang=eng,en,enUS,en-US
