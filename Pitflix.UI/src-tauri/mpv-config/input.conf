# Pitflix MPV Key Bindings
# Premium player experience with proper screenshot and subtitle controls

# ===== SCREENSHOT =====
# Plain `s` is reserved for subtitle visibility (parity with Pitflix companion + common players).
s cycle sub-visibility
# Ctrl+Alt+s = screenshot (with subtitles)
Ctrl+Alt+s screenshot
# Shift+S = screenshot without subtitles
Shift+s screenshot video

# ===== SUBTITLE CONTROLS =====
# v = toggle subtitle visibility (easy access)
v cycle sub-visibility
# Alt+s = subtitle menu (via uosc)
Alt+s script-binding uosc/subtitles
# b = cycle subtitle track
b cycle sub

# ===== AUDIO CONTROLS =====
# a = audio track menu (via uosc)
a script-binding uosc/audio
# c = cycle audio track
c cycle audio

# ===== PLAYBACK =====
# Space = play/pause (default)
SPACE cycle pause
# . and , = frame step
. frame-step
, frame-back-step
# [ and ] = speed
[ multiply speed 0.9091
] multiply speed 1.1
# Backspace = reset speed
BS set speed 1.0

# ===== SEEKING =====
# Arrow keys = seek (mpv-owned; reinforced via pitflix-player-controls.lua forced bindings)
RIGHT seek 5
LEFT seek -5
UP seek 60
DOWN seek -60
# Shift+Arrow = precise seek
Shift+RIGHT seek 1 exact
Shift+LEFT seek -1 exact

# ===== VOLUME =====
# Mouse wheel = volume (default)
# Up/Down arrows also seek, so use 0-9 for volume if needed
# m = mute (default)
m cycle mute

# ===== FULLSCREEN =====
# f = fullscreen (default)
f cycle fullscreen
# Double-click = fullscreen (default)
MBTN_LEFT_DBL cycle fullscreen

# ===== WINDOW =====
# ESC = exit fullscreen or quit
ESC set fullscreen no
# q = quit
q quit

# ===== CHAPTERS =====
# Disabled for Pitflix external companion flow.
PGUP ignore
PGDWN ignore
Ctrl+PGUP ignore
Ctrl+PGDWN ignore

# ===== MENU =====
# Right-click = uosc menu
MBTN_RIGHT script-binding uosc/menu

# ===== EPISODE NAVIGATION =====
# Forward to Pitflix companion via `pitflix-episode-nav.lua` → stdout bridge → `player2-shortcut` event.
Shift+n script-binding pitflix-episode-nav/pitflix-next-episode
Shift+p script-binding pitflix-episode-nav/pitflix-prev-episode

# ===== PLAYLIST =====
# Disabled to keep episode identity authoritative in Pitflix app state.
< ignore
> ignore
Shift+< ignore
Shift+> ignore

# ===== INFO =====
# i = show stats
i script-binding stats/display-stats-toggle
# I = show stats (persistent)
I script-binding stats/display-stats

# ===== SUBTITLE DELAY =====
# z and x = subtitle delay
z add sub-delay -0.1
x add sub-delay +0.1

# ===== SUBTITLE APPEARANCE (mpv-owned) =====
# Ctrl+Up/Down -> subtitle size, Alt+Down/Up -> subtitle vertical position
# Ctrl+1..4 -> subtitle style presets (white, warm, cyan, Arabic high-contrast)
