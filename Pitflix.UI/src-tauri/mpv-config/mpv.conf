# Pitflix mpv Configuration
# Premium video player experience with uosc UI

# ===== Window & Display =====
no-border
ontop=yes
fullscreen=no
title=${media-title}
cursor-autohide=1000
cursor-autohide-fs-only=no

# ===== Video Quality =====
# Balanced quality
hwdec=auto-safe
vo=gpu
scale=spline36
cscale=spline36
dscale=mitchell
deband=no

# ===== Playback Behavior =====
keep-open=no
hr-seek=yes
hr-seek-framedrop=no

# ===== Audio =====
volume-max=200

# ===== Subtitles =====
sub-ass-vsfilter-blur-compat=no
sub-fix-timing=yes
sub-font="Segoe UI Semibold"
sub-font-size=52
sub-color="#FFFFFF"
sub-border-size=2
sub-border-color="#00000080"
sub-shadow-offset=2
sub-shadow-color="#00000060"
sub-pos=85
sub-blur=0.2

# ===== UI & Controls =====
osc=no
osd-bar=no
osd-font="Segoe UI"
osd-font-size=28
osd-color="#FFFFFF"
osd-border-size=1.5
osd-border-color="#00000080"
osd-duration=1500
osd-align-x=center
osd-align-y=top
osd-margin-y=60

# ===== Input & Interaction =====
input-default-bindings=yes
# Force-load Pitflix scripts from bundled config to avoid silent script autoload misses.
script=~~/scripts/uosc/main.lua
script=~~/scripts/pitflix-episode-nav.lua
script=~~/scripts/pitflix-player-controls.lua
script=~~/scripts/pitflix-config-check.lua

# ===== Screenshot =====
screenshot-format=png
screenshot-png-compression=8
screenshot-template="%F-%wH.%wM.%wS"
screenshot-directory="~/Pictures/mpv"

# ===== Cache & Network =====
cache=yes
demuxer-max-bytes=128M
demuxer-max-back-bytes=64M

# ===== Performance =====
video-sync=audio
interpolation=no
priority=belownormal
framedrop=vo
vd-lavc-threads=4

# ===== Language Preferences =====
alang=eng,en,enUS,en-US
slang=eng,en,enUS,en-US
