# Pitflix Premium UI Configuration
# Cinematic, minimal, Netflix/Apple TV style

# ===== TIMELINE (Premium visible) =====
# CRITICAL: bar style with very thin size creates the clean look
# line style can appear striped depending on uosc version
timeline_style=bar
# Ultra-thin for minimal visual weight
timeline_line_width=2
# Very small height - this is key for thin appearance
timeline_size=28
# Keep visible for a true companion-like premium player feel.
timeline_persistency=always
# No border for cleaner look
timeline_border=0
# Seek 10 seconds with scroll
timeline_step=10
# Hide cache to avoid visual clutter
timeline_cache=no
# No heatmap clutter - this prevents striping
timeline_heatmap=no

# ===== PROGRESS BAR =====
progress=always
# Slightly thicker for readability on desktop distance.
progress_size=2
progress_line_width=2

# ===== CONTROLS (minimal bar) =====
# Only previous / play-pause / next episode + subtitles + playlist (folder list via uosc autoload).
controls=gap,command:skip_previous:script-message-to pitflix-episode-nav pitflix-prev-episode-msg?Previous episode,gap,play-pause,gap,command:skip_next:script-message-to pitflix-episode-nav pitflix-next-episode-msg?Next episode,gap,command:subtitles:script-binding uosc/subtitles?Subtitles,gap
controls_size=42
controls_margin=0
controls_spacing=10
# Always available in external window.
controls_persistency=always

# ===== VOLUME (Minimal) =====
volume=right
volume_size=36
# No border for cleaner look
volume_border=0
volume_step=2
# Hide volume while playing
volume_persistency=always

# ===== SPEED CONTROL =====
speed_step=0.1
speed_step_is_factor=no
speed_persistency=

# ===== MENUS (Clean) =====
menu_item_height=40
menu_min_width=280
menu_padding=8
menu_type_to_search=yes

# ===== TOP BAR (Premium with Window Controls) =====
# Always show top bar in no-border mode for window controls
top_bar=no-border
top_bar_size=44
# Show window controls (minimize, maximize, close) on the right
top_bar_controls=yes
top_bar_title=yes
top_bar_alt_title=
top_bar_alt_title_place=below
# Flash briefly on file load
top_bar_flash_on=video,audio
# Keep title/actions visible in external window.
top_bar_persistency=always

# ===== WINDOW BORDER =====
# Minimal border
window_border_size=1

# ===== BEHAVIOR =====
# Load other media files from the current directory into mpv playlist (uosc can show/toggle it).
autoload=yes
shuffle=no

# ===== VISUAL REFINEMENT =====
# Slightly larger scale for better readability
scale=1
# Larger in fullscreen
scale_fullscreen=1.2
# Clean text
font_scale=1
# Softer text border
text_border=1
# More rounded for modern feel
border_radius=10

# ===== COLORS & OPACITY (Pitflix dark theme) =====
# Dark base + purple/cyan accents to align with app palette and reduce white/default look.
color=foreground=a78bfa,foreground_text=e2e8f0,background=0b1020,background_text=e2e8f0,curtain=05070f,success=22c55e,error=ef4444
opacity=timeline=0.86,position=0.95,chapters=0,slider=0.9,slider_gauge=1,controls=0.9,speed=0.82,menu=0.94,submenu=0.78,border=0.95,title=0.96,tooltip=0.9,thumbnail=1,curtain=0.92,idle_indicator=0.55,audio_indicator=0.5,buffering_indicator=0.35,playlist_position=0

# ===== REFINEMENTS =====
refine=text_width

# ===== ANIMATIONS (Smooth & Cinematic) =====
# Smooth, elegant animations
animation_duration=250
# Shorter flash for subtlety
flash_duration=500
# Proximity-based fade for natural feel
# UI appears when cursor is within 100px of bottom
proximity_in=100
# UI fades when cursor moves 180px away
proximity_out=180

# ===== FONT =====
font_bold=no

# ===== TIME DISPLAY =====
destination_time=playtime-remaining
time_precision=0
buffered_time_threshold=60

# ===== AUTO-HIDE (Quick & Clean) =====
# Keep controls available; rely on subtle opacity, not complete hide.
autohide=yes

# ===== PAUSE INDICATOR (Subtle) =====
# Flash briefly on pause
pause_indicator=flash

# ===== STREAM QUALITY =====
stream_quality_options=4320,2160,1440,1080,720,480,360,240

# ===== FILE TYPES =====
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt
playlist_types=m3u,m3u8,pls,url,cue

# ===== LOAD TYPES =====
load_types=video,audio,image

# ===== DIRECTORIES =====
default_directory=~/
show_hidden_files=no
use_trash=no

# ===== OSD MARGINS =====
adjust_osd_margins=yes

# ===== CHAPTER RANGES =====
# Disabled entirely for external companion flow.
chapter_ranges=
chapter_range_patterns=

# ===== LOCALIZATION =====
languages=slang,en
subtitles_directory=~~/subtitles

# ===== DISABLE ELEMENTS =====
# Keep chapters disabled; allow playlist UI (folder playlist).
disable_elements=chapters
