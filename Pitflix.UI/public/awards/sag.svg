<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" fill="none">
  <defs>
    <linearGradient id="gv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="60%" stop-color="#C9920A"/>
      <stop offset="100%" stop-color="#8B6000"/>
    </linearGradient>
    <linearGradient id="gh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6000"/>
      <stop offset="40%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#8B6000"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <ellipse cx="30" cy="94" rx="20" ry="5" fill="#7A5600"/>
  <rect x="10" y="82" width="40" height="12" rx="3" fill="url(#gv)"/>
  <ellipse cx="30" cy="82" rx="20" ry="5" fill="#F5C842"/>
  <!-- Legs -->
  <rect x="23" y="64" width="5" height="20" rx="2" fill="url(#gv)"/>
  <rect x="32" y="64" width="5" height="20" rx="2" fill="url(#gv)"/>
  <!-- Torso -->
  <path d="M18 64 Q20 52 30 50 Q40 52 42 64 Z" fill="url(#gh)"/>
  <!-- Left arm raised (holding mask) -->
  <path d="M18 62 Q8 54 6 40" stroke="#C9920A" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Right arm down -->
  <path d="M42 62 Q50 58 52 66" stroke="#C9920A" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Neck -->
  <rect x="27" y="44" width="6" height="7" rx="3" fill="url(#gv)"/>
  <!-- Head -->
  <ellipse cx="30" cy="36" rx="10" ry="11" fill="url(#gh)"/>
  <ellipse cx="26" cy="31" rx="4" ry="5" fill="#FFDF70" opacity="0.3"/>
  <!-- Theatrical mask held in left hand -->
  <g transform="translate(-2,28) rotate(-20,12,16)">
    <ellipse cx="12" cy="16" rx="9" ry="8" fill="#F5C842" stroke="#A07010" stroke-width="1.2"/>
    <ellipse cx="8.5" cy="15" rx="2.2" ry="1.8" fill="#8B6000"/>
    <ellipse cx="15.5" cy="15" rx="2.2" ry="1.8" fill="#8B6000"/>
    <path d="M7 20 Q12 23 17 20" stroke="#8B6000" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
