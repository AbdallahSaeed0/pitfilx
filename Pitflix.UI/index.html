<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pitflix_icon_final.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-render-blocking: as a plain stylesheet this gates first paint on a network
      round-trip to Google, and the window is transparent+undecorated, so "not painted yet"
      means the user stares at their desktop instead of the app. `display=swap` is already in
      the URL, so text paints in the fallback face immediately and swaps when the webfont
      lands — and the app still starts instantly with no internet at all.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Pitflix</title>
    <style>
      /* Painted by the webview the moment index.html parses — before the 872 KB JS bundle has
         even downloaded. Without it the transparent window renders as a hole onto the desktop
         for the whole boot, which reads as "the app didn't start". Removed by main.tsx once
         React has actually mounted. */
      html,
      body {
        margin: 0;
        background: #0b0b0f;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0f;
        z-index: 9999;
      }
      #boot-splash .ring {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .ring {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash"><div class="ring"></div></div>
    <div id="root"></div>
    <script>
      // WebView2 shows a native Back/Refresh menu unless disabled at the OS level too.
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
