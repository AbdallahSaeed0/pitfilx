<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitflix Animated Logo</title>
<style>
  @font-face {
    font-family: 'Bebas Neue';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5/files/bebas-neue-latin-400-normal.woff2') format('woff2');
    font-display: block;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0916;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    gap: 40px;
  }
  svg { width: min(560px, 90vw); display: block; }
  button {
    background: rgba(124,58,237,0.12);
    border: 1px solid rgba(124,58,237,0.4);
    color: #7c3aed;
    padding: 10px 28px;
    border-radius: 8px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: system-ui, sans-serif;
  }
  button:hover { background: rgba(124,58,237,0.22); }
</style>
</head>
<body>
<svg id="logo-svg" viewBox="0 0 231 110">
  <defs id="logo-defs">
    <clipPath id="fill-bounds">
      <rect x="-10" y="26" width="2000" height="70"/>
    </clipPath>
    <clipPath id="cp-p">
      <path transform="translate(0,26) scale(0.7)" clip-rule="evenodd"
        d="M 0,0 L 0,100 L 12,100 L 12,54 C 32,54 54,46 54,27 C 54,8 32,0 12,0 Z M 15,8 L 15,46 L 46,27 Z"/>
    </clipPath>
    <clipPath id="cp-i1"><text x="40" y="96" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:100px">I</text></clipPath>
    <clipPath id="cp-t"><text x="59.206" y="96" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:100px">T</text></clipPath>
    <clipPath id="cp-f"><text x="95.609" y="96" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:100px">F</text></clipPath>
    <clipPath id="cp-l"><text x="130.022" y="96" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:100px">L</text></clipPath>
    <clipPath id="cp-i2"><text x="164.425" y="96" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:100px">I</text></clipPath>
    <clipPath id="cp-x"><text x="183.632" y="96" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:100px">X</text></clipPath>
  </defs>

  <rect width="231" height="110" fill="#0a0916"/>

  <g transform="translate(0,26) scale(0.7)" opacity="0.14">
    <path fill-rule="evenodd" fill="#7c3aed"
      d="M 0,0 L 0,100 L 12,100 L 12,54 C 32,54 54,46 54,27 C 54,8 32,0 12,0 Z M 15,8 L 15,46 L 46,27 Z"/>
  </g>
  <text x="40" y="96" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:100px"
    fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.14">ITFLIX</text>

  <g id="fills" clip-path="url(#fill-bounds)">
    <rect id="r-p"  x="0"     y="26" width="38"   height="70" fill="#7c3aed" clip-path="url(#cp-p)"/>
    <rect id="r-i1" x="39"    y="26" width="21.2" height="70" fill="#7c3aed" clip-path="url(#cp-i1)"/>
    <rect id="r-t"  x="58.2"  y="26" width="38.4" height="70" fill="#7c3aed" clip-path="url(#cp-t)"/>
    <rect id="r-f"  x="94.6"  y="26" width="36.4" height="70" fill="#7c3aed" clip-path="url(#cp-f)"/>
    <rect id="r-l"  x="129"   y="26" width="36.4" height="70" fill="#7c3aed" clip-path="url(#cp-l)"/>
    <rect id="r-i2" x="163.4" y="26" width="21.2" height="70" fill="#7c3aed" clip-path="url(#cp-i2)"/>
    <rect id="r-x"  x="182.6" y="26" width="42.6" height="70" fill="#7c3aed" clip-path="url(#cp-x)"/>
  </g>
</svg>

<button onclick="play()">↺ Replay</button>

<script>
const IDS = ['r-p','r-i1','r-t','r-f','r-l','r-i2','r-x'];
const DUR = 1800, STAGGER = 550;

function play() {
  const rects = IDS.map(id => document.getElementById(id));
  rects.forEach(r => {
    r.style.transition = 'none';
    r.style.transform  = 'translateY(70px)';
    r.style.transformBox    = 'fill-box';
    r.style.transformOrigin = '50% 0%';
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    rects.forEach((r, i) => {
      r.style.transition = `transform ${DUR}ms ${i*STAGGER}ms cubic-bezier(0.22,1,0.36,1)`;
      r.style.transform  = 'translateY(0px)';
    });
  }));
}

document.fonts.ready.then(() => setTimeout(play, 300));
</script>
</body>
</html>
